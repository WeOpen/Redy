# Redy 视觉物料 PR 的独立验证，不触发正式站点部署。
name: Verify brand assets and site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and asset checks
        run: npm test

      - name: Verify static export for GitHub Pages
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'
