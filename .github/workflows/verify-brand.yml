# Redy 视觉物料 PR 的独立验证，不触发正式站点部署。
name: Verify brand assets and site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and asset checks
        run: npm test

      - name: Verify static export for GitHub Pages
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Setup Python for icon exports
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==11.1.0

      - name: Verify PNG exports of adaptive Redy icons
        run: python scripts/export-redy-2-icons.py --output-dir ./exported/redy-2-icons

      - name: Upload icon previews for visual review
        uses: actions/upload-artifact@v4
        with:
          name: redy-2-candidate-icon-pngs
          path: ./exported/redy-2-icons/*.png
          retention-days: 14
